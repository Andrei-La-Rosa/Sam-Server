<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
<title>Quiz Upload</title>
<style>
:root {
--base-color: white;
--text-color: black;
--primary-color: yellow;
--secondary-color: #8D8DFF;
--color-1: gray;
--color-2: white;
--color-3: white;
}

.left a {
    padding: 0;
    position: fixed;
    top: 20px;
    width: 50px;
    height: 50px;
    background-color: var(--secondary-color);
    color: var(--base-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s ease-in-out;
    z-index: 1000;
}

.left a{
    left: 20px
}
  
.left a:hover {
    transform: scale(1.1);
}

body {
    background-image: url("../Haru.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    margin: 0;
    padding: 1em;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text-color);
}

.slider-container{
    position: relative;
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
    text-align:center;
}

.slider-wrapper{
    width:100%;
    max-width:700px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.slider{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.slider::-webkit-scrollbar{
    display:none;
}
.quiz-card{
    width: 300px;
    margin: auto;
    border-radius:15px; 
    overflow:hidden; 
    background: var(--base-color);
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

.quiz-card:hover{
    transform: scale(1.05);
}

.quiz-card img{
    width: 300px;
    height: 300px;
    object-fit:contain;
    display:block;
    margin:auto;
    background: var(--text-color);
}

.quiz-card h3{
    padding:10px;
    margin: 0;
}

#dots{
    margin-top:15px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#bbb;
    display:inline-block;
    margin:0 5px;
    cursor:pointer;
}

.dot.active{
    background:var(--secondary-color);
}

.slide-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    font-size:28px;
    border-radius:50%;
    z-index:10;
}

.prev{
    left:-5%;
}

.next{
    right:-5%;
}

/* PAGE LOAD ANIMATION */
body {
  opacity: 0;
  transform: translateY(20px);
  animation: pageEnter 0.6s ease forwards;
}

@keyframes pageEnter {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Container */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 50px;
  gap: 40px;
}

/* Card */
.card {
  background: var(--base-color);
  padding: 20px;
  width: 300px;
  text-align: center;
  border-radius: 15px;
  box-shadow: 0 0 20px var(--text-color);
} 

.card {
  opacity: 0;
  transform: scale(0.9);
  animation: cardPop 0.5s ease forwards;
  animation-delay: 0.3s;
}
  
@keyframes cardPop {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.card h2 {
  margin-bottom: 10px;
}

/* Form */
form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input {
  padding: 10px;
  border: 1px solid var(--secondary-color);
  border-radius: 4px;
  font-size: 14px;
}
  
input[type="file"] {
  padding: 5px;
  border: 1px solid var(--secondary-color);
  border-radius: 6px;
  background-color: var(--color-1);
}

input[type="file"]::file-selector-button {
  background-color: var(--secondary-color); 
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 10px;
}

input[type="file"]::file-selector-button:hover {
  text-decoration: underline;
}

.menu-btn {
    position: absolute;
    top: 50%;
    right: -20px;
    transform: translateY(-50%);

    background: var(--text-color);
    color: white;
    border: none;
    padding: 12px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;

    z-index: 3000;
}

#quizList {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#quizList button {
  background: var(--secondary-color);
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

#quizList button:hover {
    background: #6c6cff;
}

button { 
  background: var(--secondary-color);
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
} 
  
  button:hover { 
    text-decoration: underline;
    
  }

@media (max-width: 480px) {
  body{
   display: center;
  } 

  .card {
    padding: 20px;
    border-radius: 12px;
  }

  .left a {
    background: transparent;
    box-shadow: none;        
    color: var(--secondary-color);
    width: auto;
    height: auto;
    font-size: 28px;
  }

  .container {
    margin-top: 10px;
  }

  input, button {
    font-size: 16px;
  }

  .slider-wrapper{
    width:95%;
    max-width:800px;
  }
 
  .quiz-card img{
    height:300px;
    object-fit:contain;
  }
}

</style>
</head>
<body>
<header>

<div class="left">
     <a href="../Activities.html">
        <i class="ri-arrow-left-line"></i>
     </a>
</div>

<div class="container">
    <div class="card">
        <h2>Quiz Upload</h2>
        <form id="quiz-form">
        <label>Title:</label>
        <input type="text" id="title">

        <label>Upload File:</label>
        <input type="file" id="file">

        <label>Upload Image:</label>
        <input type="file" id="image">

        <button type="button" onclick="submitQuiz()">Submit</button>
        </form>
    </div>
</div>

<div class="slider-container">
    <h2>Uploaded Quizzes</h2>

    <button class="slide-btn prev" onclick="slideLeft()">
        <i class="ri-arrow-left-s-line"></i>
    </button>

    <div class="slider-wrapper">
         <div class="slider" id="quizSlider"></div>
         <div id="dots"></div>
    </div>

    <button class="slide-btn next" onclick="slideRight()">
        <i class="ri-arrow-right-s-line"></i>
    </button>
</div>

</header>
<script>

function initializeDefaultQuiz() {
    let quizzes = JSON.parse(localStorage.getItem("quizzes"));

    // If already initialized, do nothing
    if (quizzes && quizzes.length > 0) return;

    let defaultQuizzes = [
        {
            title: "Quiz #1",
            image: "../Quizzes/Quiz01.jpeg",
        },
        {
            title: "Quiz #2",
            image: "../Quizzes/Quiz02.jpeg",
        },
        {
            title: "Quiz #3",
            image: "../Quizzes/Quiz03.jpeg"
        }, 
        {
            title: "Long Quiz #1", 
            image: "../Quizzes/Midterm Long Quiz #1.jpg"
        }, 
        {
            title: "Finals Quiz #1", 
            image: "../Quizzes/Finals Quiz #1.jpg"
        }, 
        {           
            title: "Finals Quiz #2", 
            image: "../Quizzes/Finals Quiz #2.jpg"
        }, 
        {
            title: "Finals Long Quiz #2", 
            image: "../Quizzes/Finals Long Quiz #2.jpg"
        } 
        
    ];

    localStorage.setItem("quizzes", JSON.stringify(defaultQuizzes));
}

document.getElementById("quiz-form").addEventListener("submit", function(e) {
    e.preventDefault();
});

function submitQuiz() {

    const title = document.getElementById("title").value.trim();
    const imageInput = document.getElementById("image").files[0];

    if (!title || !imageInput) {
        alert("Please complete all fields!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {
        let quizzes = JSON.parse(localStorage.getItem("quizzes")) || [];

        quizzes.push({
            title: title,
            image: reader.result
        });

        localStorage.setItem("quizzes", JSON.stringify(quizzes));

        alert("Quiz submitted!");
        document.getElementById("quiz-form").reset();

        window.location.href = "../Store/Quiz.html";
    };

    reader.readAsDataURL(imageInput);
}

let currentSlide = 0;
let quizzes = [];
function loadSliderQuizzes(){

    quizzes = JSON.parse(localStorage.getItem("quizzes")) || [];

    showSlide(currentSlide);
}
function showSlide(index){

    const slider = document.getElementById("quizSlider");
    const dots = document.getElementById("dots");

    slider.innerHTML = "";
    dots.innerHTML = "";

    const quiz = quizzes[index];

    const card = document.createElement("div");
    card.className = "quiz-card";

    card.innerHTML = `
        <img src="${quiz.image}">
        <h3>${quiz.title}</h3>
    `;

    card.onclick = () => {

        localStorage.setItem("selectedQuiz", index);

        window.location.href = "../Store/Quiz.html";
    };

    slider.appendChild(card);

    quizzes.forEach((_, i)=>{

        const dot = document.createElement("span");
        dot.className = "dot";

        if(i === index){
            dot.classList.add("active");
        }
        dot.onclick = ()=>{
            currentSlide = i;
            showSlide(currentSlide);
        };

        dots.appendChild(dot);
    });
}

function slideLeft(){

    currentSlide--;

    if(currentSlide < 0){
        currentSlide = quizzes.length - 1;
    }

    showSlide(currentSlide);
}

function slideRight(){

    currentSlide++;

    if(currentSlide >= quizzes.length){
        currentSlide = 0;
    }

    showSlide(currentSlide);
}

initializeDefaultQuiz();
loadSliderQuizzes();
</script>
</body>
</html>
