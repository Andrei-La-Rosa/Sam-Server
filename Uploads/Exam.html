<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
<title>Exam Upload</title>
<style>
:root {
--base-color: white;
--text-color: black;
--primary-color: yellow;
--secondary-color: #8D8DFF;
--color-1: gray;
--color-2: white;
--color-3: white;
}

.left a {
    padding: 0;
    position: fixed;
    top: 20px;
    width: 50px;
    height: 50px;
    background-color: var(--secondary-color);
    color: var(--base-color);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    font-size: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transition: 0.3s ease-in-out;
    z-index: 1000;
}

.left a{
    left: 20px;
}

.left a:hover {
    transform: scale(1.1);
}

body {
    background-image: url("../Haru.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    margin: 0;
    padding: 1em;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: var(--text-color);
}

/* PAGE LOAD ANIMATION */
body {
  opacity: 0;
  transform: translateY(20px);
  animation: pageEnter 0.6s ease forwards;
}

@keyframes pageEnter {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h3 {
  text-align: center;
} 

/* Container */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 50px;
  gap: 40px;
}

.slider-container{
    position: relative;
    width: 90%;
    max-width: 900px;
    margin: 40px auto;
    text-align:center;
}

.slider-wrapper{
    width:100%;
    max-width:700px;
    margin:auto;
    display:flex;
    flex-direction:column;
    align-items:center;
}

.slider{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.slider::-webkit-scrollbar{
    display:none;
}

.exam-card{
    width: 300px;
    margin: auto;
    border-radius:15px; 
    overflow:hidden; 
    background: var(--base-color);
    box-shadow:0 0 15px rgba(0,0,0,.4);
}

.exam-card:hover{
    transform: scale(1.05);
}

.exam-card img{
    width: 300px;
    height: 300px;
    object-fit:contain;
    display:block;
    margin:auto;
    background: var(--text-color);
}

.exam-card h3{
    padding:10px;
    margin: 0;
}

#dots{
    margin-top:15px;
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
    background:#bbb;
    display:inline-block;
    margin:0 5px;
    cursor:pointer;
}

.dot.active{
    background:var(--secondary-color);
}

.slide-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    font-size:28px;
    border-radius:50%;
    z-index:10;
}

.prev{
    left:-5%;
}

.next{
    right:-5%;
}

#examList {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

#examList button {
  background: var(--secondary-color);
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
} 

#examList button:hover {
    background: #6c6cff;
}

/* Card */
.card {
  background: var(--base-color);
  padding: 40px;
  width: 300px;
  text-align: center;
  border-radius: 15px;
  box-shadow: 0 0 20px var(--text-color);

  opacity: 0;
  transform: scale(0.9);
  animation: cardPop 0.5s ease forwards;
  animation-delay: 0.3s;
}

@keyframes cardPop {
  to {
    opacity: 1;
    transform: scale(1);
  }
} 

.card h2 {
  margin-bottom: 10px;
}

/* Form */
form {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

input {
  padding: 10px;
  border: 1px solid var(--secondary-color);
  border-radius: 4px;
  font-size: 14px;
}
  
input[type="file"] {
  padding: 5px;
  border: 1px solid var(--secondary-color);
  border-radius: 6px;
  background-color: var(--color-1);
}

input[type="file"]::file-selector-button {
  background-color: var(--secondary-color); 
  color: white;
  border: none;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
  margin-right: 10px;
}

input[type="file"]::file-selector-button:hover {
  text-decoration: underline;
}
  
button { 
  background: var(--secondary-color);
  padding: 10px;
  margin: 5px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
} 
  
  button:hover { 
    text-decoration: underline;
  }

@media (max-width: 480px) {
  .card {
    padding: 20px;
    border-radius: 12px;
  }

  .left a{
    background: transparent; 
    box-shadow: none;        
    color: var(--secondary-color);
    width: auto;
    height: auto;
    font-size: 28px;
  }

  .container {
    margin-top: 10px;
  } 

  input, button {
    font-size: 16px; /* better tap usability */
  }

  .sidebar {
      width: 150px;
  }
}
</style>
</head>
<body>
<header>
<div class="left">
     <a href="../Activities.html">
        <i class="ri-arrow-left-line"></i>
     </a>
</div>

<div class="sidebar">
  <button class="menu-btn" onclick="toggleSidebar()">
    <i class="ri-arrow-right-line"></i>
  </button>
 
  <h3 style="color:white;">My Exams</h3>
  <div id="examList"></div>
</div>

<div class="container">
    <div class="card">
        <h2>Exam Upload</h2>
        <form id="exam-form">
        <label>Title:</label>
        <input type="text" id="title">

        <label>Upload File:</label>
        <input type="file" id="file">

        <label>Upload Image:</label>
        <input type="file" id="image">

        <button type="button" onclick="submitExam()">Submit</button>
        </form>
    </div>
</div>

<div class="slider-container">
    <h2>Uploaded Exams</h2>

    <button class="slide-btn prev" onclick="slideLeft()">
        <i class="ri-arrow-left-s-line"></i>
    </button>

    <div class="slider-wrapper">
         <div class="slider" id="examSlider"></div>
         <div id="dots"></div>
    </div>

    <button class="slide-btn next" onclick="slideRight()">
        <i class="ri-arrow-right-s-line"></i>
    </button>
</div>
</header>
<script>

function initializeDefaultExams() {
    let exam = JSON.parse(localStorage.getItem("exam"));

    // If already initialized, do nothing
    if (exam && exam.length > 0) return;

    let defaultExam = [
        {
            title: "Midterm Exam",
            image: "../My Exams/Midterm.jpeg",
        },
    ];

    localStorage.setItem("exam", JSON.stringify(defaultExam));
}

document.getElementById("exam-form").addEventListener("submit", function(e) {
    e.preventDefault();
});   

function submitExam() {

    const title = document.getElementById("title").value.trim();
    const imageInput = document.getElementById("image").files[0];

    if (!title || !imageInput) {
        alert("Please complete all fields!");
        return;
    }

    const reader = new FileReader();

    reader.onload = function () {
        let exams = JSON.parse(localStorage.getItem("exams")) || [];

        exams.push({
            title: title,
            image: reader.result
        });

        localStorage.setItem("exams", JSON.stringify(exams));

        alert("Exam submitted!");
        document.getElementById("exam-form").reset();

        window.location.href="../Store/Exams.html";
    };

    reader.readAsDataURL(imageInput);
}

let currentSlide = 0;
let exam = [];
function loadSliderExams(){

    exam = JSON.parse(localStorage.getItem("exam")) || [];

    showSlide(currentSlide);
}

function showSlide(index){

    const slider = document.getElementById("examSlider");
    const dots = document.getElementById("dots");

    slider.innerHTML = "";
    dots.innerHTML = "";

    const exams = exam[index];

    const card = document.createElement("div");
    card.className = "exams-card";

    card.innerHTML = `
        <img src="${exam.image}">
        <h3>${exam.title}</h3>
    `;

    card.onclick = () => {

        localStorage.setItem("selectedExam", index);

        window.location.href = "../Store/Exams.html";
    };

    slider.appendChild(card);

    exam.forEach((_, i)=>{

        const dot = document.createElement("span");
        dot.className = "dot";

        if(i === index){
            dot.classList.add("active");
        }
        dot.onclick = ()=>{
            currentSlide = i;
            showSlide(currentSlide);
        };

        dots.appendChild(dot);
    });
}

function slideLeft(){

    currentSlide--;

    if(currentSlide < 0){
        currentSlide = exam.length - 1;
    }

    showSlide(currentSlide);
}

function slideRight(){

    currentSlide++;

    if(currentSlide >= exam.length){
        currentSlide = 0;
    }

    showSlide(currentSlide);
}

initializeDefaultExams();
loadSliderExam();
</script>
</body>
</html>
